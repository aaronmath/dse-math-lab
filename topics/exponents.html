<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>整數指數定律｜動數 Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/>
<style>
.hero{padding:36px 0 8px}.hero h1{font-size:32px;margin:8px 0}
.stage-q{background:#0a1220;border:1px solid var(--line);border-radius:18px;padding:24px 16px;min-height:92px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}
.steps{margin-top:14px;display:grid;gap:8px}
.step{display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:center;background:#0a1220;border:1px solid var(--line);border-radius:14px;padding:12px 14px;opacity:0;transform:translateY(8px);transition:.35s}
.step.on{opacity:1;transform:none}
.step .num{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(94,234,212,.12);color:var(--teal);font-weight:800}
.step .lab{font-size:12px;color:var(--muted);margin-bottom:4px}
.math{font-size:22px;font-weight:800}
.hl{color:#fbbf24;display:inline-block;animation:pop .4s ease}
@keyframes pop{from{transform:translateY(-8px);opacity:.25}to{transform:none;opacity:1}}
.mf{display:inline-block;text-align:center;line-height:1.15;vertical-align:middle}
.mf .n{display:block;border-bottom:1.5px solid currentColor;padding:0 8px 3px;white-space:nowrap}
.mf .d{display:block;padding:3px 8px 0;white-space:nowrap}
.ans{border-color:rgba(94,234,212,.45)}
.ans .math{color:var(--teal)}
</style>
</head>
<body>
<div class="bg-grid"></div>
<nav class="top"><div class="nav-inner">
<a class="brand" href="../index.html"><span class="logo">動</span>動數 Lab</a>
<div class="nav-links">

</div></div></nav>
<div class="wrap">
<header class="hero">
<div class="kicker">Topic 02 · 整數指數定律</div>
<h1>化簡 · <span>正指數</span></h1>
</header>
<div class="controls">
<button class="btn btn-primary" id="new">出題</button>
<button class="btn btn-ghost" id="next">下一步</button>
<button class="btn btn-ghost" id="all">全部步驟</button>
</div>
<div class="panel">
<div class="stage-q" id="q"></div>
<div class="steps" id="steps"></div>
</div>
<footer><a href="../index.html" style="color:var(--teal)">返主頁</a></footer>
</div>
<script src="../js/main.js"></script>
<script>
const S={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function sup(n){return String(n).split('').map(function(c){return S[c]||c;}).join('');}
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function nz(a,b){var n=rnd(a,b);return n===0?((rnd(0,1)?a:b)||1):n;}
function term(b,e){if(!e)return '';if(e===1)return b;return b+sup(e);}
function show(m){var ks=Object.keys(m).filter(function(k){return m[k];}).sort();return ks.length?ks.map(function(k){return term(k,m[k]);}).join(''):'1';}
function mf(n,d){var N=typeof n==='string'?n:show(n),D=typeof d==='string'?d:show(d);if(D==='1')return N;return '<span class="mf"><span class="n">'+N+'</span><span class="d">'+D+'</span></span>';}
function powM(m,n){var o={};Object.keys(m).forEach(function(k){o[k]=m[k]*n;});return o;}
function addM(a,b){var o=Object.assign({},a);Object.keys(b||{}).forEach(function(k){o[k]=(o[k]||0)+b[k];});return o;}
function clean(m){var o={};Object.keys(m||{}).forEach(function(k){if(m[k])o[k]=m[k];});return o;}
function split(m){var n={},d={};Object.keys(m).forEach(function(k){if(m[k]>0)n[k]=m[k];else if(m[k]<0)d[k]=-m[k];});return[clean(n),clean(d)];}
function paren(m,n){return n===1?show(m):'('+show(m)+')'+sup(n);}
var G={i:0,steps:[],q:''};
function gen(){
 var pair=pick([['x','y'],['m','n'],['a','b']]),x=pair[0],y=pair[1],t=rnd(0,4),A={},B={},num,den,raw;
 if(t===0){var n=rnd(2,5);A[x]=1;A[y]=nz(-4,4);den={};den[x]=nz(-3,4);den[y]=nz(-3,5);num=powM(A,n);raw=mf(paren(A,n),show(den));}
 else if(t===1){var n=rnd(2,5);A[x]=rnd(1,3);A[y]=1;num={};num[x]=rnd(2,8);num[y]=rnd(2,8);den=powM(A,n);raw=mf(show(num),paren(A,n));}
 else if(t===2){var n=rnd(2,4);A[x]=nz(-3,4);A[y]=rnd(-5,-1);num=powM(A,n);den={};den[y]=rnd(2,6);raw=mf(paren(A,n),show(den));}
 else if(t===3){var n=rnd(2,5);A[x]=1;A[y]=nz(-3,3);B[x]=rnd(-4,-1);B[y]=rnd(1,4);num=addM(A,powM(B,n));den={};raw='('+show(A)+')('+show(B)+')'+sup(n);}
 else{var n=rnd(2,4);A[x]=rnd(2,6);A[y]=rnd(-5,-2);num=powM(A,n);den={};den[x]=nz(-4,3);den[y]=nz(-3,4);raw=mf(paren(A,n),show(den));}
 num=clean(num);den=clean(den);
 var merged=addM(num,powM(den,-1)), moved=split(merged), hasNeg=Object.keys(merged).some(function(k){return merged[k]<0;});
 var steps=[{lab:'去括號',html:mf(num,den)}];
 steps.push({lab:'同底合併',html:show(merged)});
 if(hasNeg) steps.push({lab:'負指數搬層',html:mf(moved[0],moved[1])});
 steps.push({lab:'答案',html:mf(moved[0],moved[1]),ans:true});
 G={i:0,steps:steps,q:raw};
}
function paint(){
 document.getElementById('q').innerHTML=G.q;
 document.getElementById('steps').innerHTML=G.steps.map(function(s,i){
  var body=s.html;if(i===G.i-1) body='<span class="hl">'+body+'</span>';
  return '<div class="step'+(i<G.i?' on':'')+(s.ans?' ans':'')+'"><div class="num">'+(i+1)+'</div><div><div class="lab">'+s.lab+'</div><div class="math">'+body+'</div></div></div>';
 }).join('');
}
function boot(){gen();paint();}
document.getElementById('new').onclick=boot;
document.getElementById('next').onclick=function(){if(G.i<G.steps.length){G.i++;paint();}};
document.getElementById('all').onclick=function(){G.i=G.steps.length;paint();};
boot();
</script>
</body>
</html>

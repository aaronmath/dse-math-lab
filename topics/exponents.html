<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>整數指數定律｜動數 Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/>
<style>
.hero{padding:32px 0 8px}.hero h1{font-size:30px;margin:8px 0}
.seg{display:flex;flex-wrap:wrap;background:#0a1220;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 8px 12px 0}
.seg button{background:transparent;border:0;color:var(--muted);padding:8px 12px;font:600 12px/1 "Noto Sans TC";cursor:pointer}
.seg button.active{background:rgba(94,234,212,.12);color:var(--teal)}
.stage-q{background:#0a1220;border:1px solid var(--line);border-radius:18px;padding:22px 14px;min-height:96px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800}
.cards{margin-top:12px;display:grid;gap:10px}
.sc{background:#0a1220;border:1px solid var(--line);border-radius:16px;padding:14px 16px;opacity:0;transform:translateY(10px);transition:.35s}
.sc.on{opacity:1;transform:none}
.sc .lab{font-size:12px;color:var(--muted);margin-bottom:8px}
.math{font-size:24px;font-weight:800;min-height:64px;display:flex;align-items:center;justify-content:center}
.sc.ans{border-color:rgba(94,234,212,.4)}.sc.ans .math{color:var(--teal)}
.mf{display:inline-block;text-align:center;line-height:1.2;vertical-align:middle}
.mf .n,.mf .d{display:block;white-space:nowrap;min-height:1.2em}
.mf .n{border-bottom:1.6px solid currentColor;padding:0 8px 4px}.mf .d{padding:4px 8px 0}
.tok{display:inline-block;margin:0 2px;position:relative}
.tok.neg{color:#fbbf24}
.tok.fly-dn{animation:dn .7s ease forwards}.tok.fly-up{animation:up .7s ease forwards}
@keyframes dn{to{transform:translateY(28px);opacity:.15}}
@keyframes up{to{transform:translateY(-28px);opacity:.15}}
.tok.merge{animation:pop .45s ease}
@keyframes pop{from{transform:scale(1.35);color:#fbbf24}to{transform:none}}
</style>
</head>
<body>
<div class="bg-grid"></div>
<nav class="top"><div class="nav-inner">
<a class="brand" href="../index.html"><span class="logo">動</span>動數 Lab</a>
<div class="nav-links">
<a href="factorization.html">因式分解</a>
<a class="active" href="exponents.html">指數定律</a>
<a href="triangles.html">相似／全等</a>
<a href="ratios.html">面積與體積比</a>
</div></div></nav>
<div class="wrap">
<header class="hero"><div class="kicker">Topic 02 · 整數指數定律</div><h1>化簡 · <span>正指數</span></h1></header>
<div class="controls">
<div class="seg" id="filt">
<button class="active" data-t="all">全部</button>
<button data-t="den">括號在分母</button>
<button data-t="num">括號在分子</button>
<button data-t="prod">兩組相乘</button>
<button data-t="negout">外層負指數</button>
</div>
<button class="btn btn-primary" id="new">出題</button>
<button class="btn btn-ghost" id="next">下一步</button>
<button class="btn btn-ghost" id="all">全部步驟</button>
</div>
<div class="panel"><div class="stage-q" id="q"></div><div class="cards" id="cards"></div></div>
<footer><a href="../index.html" style="color:var(--teal)">返主頁</a></footer>
</div>
<script src="../js/main.js"></script>
<script>
const U={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function sup(n){return String(n).split('').map(function(c){return U[c]||c;}).join('');}
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function nz(a,b){var n=rnd(a,b);return n===0?(a===0?b:a):n;}
function term(b,e){if(!e)return '';if(e===1)return b;return b+sup(e);}
function keys(m){return Object.keys(m||{}).filter(function(k){return m[k];}).sort();}
function show(m){var k=keys(m);return k.length?k.map(function(x){return term(x,m[x]);}).join(''):'1';}
function toks(m,layer){var k=keys(m);if(!k.length)return '<span class="tok">1</span>';return k.map(function(x){var e=m[x];return '<span class="tok'+(e<0?' neg':'')+'" data-l="'+layer+'">'+term(x,e)+'</span>';}).join('');}
function fracTok(n,d){if(!keys(d).length)return toks(n,'n');return '<span class="mf"><span class="n">'+toks(n,'n')+'</span><span class="d">'+toks(d,'d')+'</span></span>';}
function fracShow(n,d){if(!keys(d).length)return show(n)||'1';return '<span class="mf"><span class="n">'+(show(n)||'1')+'</span><span class="d">'+(show(d)||'1')+'</span></span>';}
function paren(m,p){return '('+show(m)+')'+sup(p);}
function powM(m,p){var o={};keys(m).forEach(function(k){o[k]=m[k]*p;});return o;}
function addM(a,b){var o={};[a,b].forEach(function(m){keys(m).forEach(function(k){o[k]=(o[k]||0)+m[k];});});return o;}
function copy(m){var o={};keys(m).forEach(function(k){o[k]=m[k];});return o;}
function moveLayer(n,d){var N=copy(n),D=copy(d);keys(n).forEach(function(k){if(n[k]<0){D[k]=(D[k]||0)-n[k];delete N[k];}});keys(d).forEach(function(k){if(d[k]<0){N[k]=(N[k]||0)-d[k];delete D[k];}});return[N,D];}
function simp(n,d){var N=copy(n),D=copy(d),all={};keys(N).concat(keys(D)).forEach(function(k){all[k]=1;});Object.keys(all).forEach(function(k){var a=N[k]||0,b=D[k]||0;if(a&&b){if(a>b){N[k]=a-b;delete D[k];}else if(b>a){D[k]=b-a;delete N[k];}else{delete N[k];delete D[k];}}});return[N,D];}
function hasNeg(n,d){return keys(n).some(function(k){return n[k]<0;})||keys(d).some(function(k){return d[k]<0;});}
var FILT='all',G={i:0,steps:[],q:''};
function gen(){
 var pair=pick([['x','y'],['m','n'],['a','b']]),x=pair[0],y=pair[1];
 var t=FILT==='all'?pick(['den','num','prod','negout']):FILT;
 var A={},B={},num,den,raw;
 if(t==='den'){var p=rnd(2,5);A[x]=rnd(1,3);A[y]=1;num={};num[x]=rnd(4,12);num[y]=rnd(3,10);den=powM(A,p);raw='<span class="mf"><span class="n">'+show(num)+'</span><span class="d">'+paren(A,p)+'</span></span>';}
 else if(t==='num'){var p=rnd(2,4);A[x]=nz(-3,4);A[y]=rnd(-4,-1);num=powM(A,p);den={};den[y]=rnd(2,5);raw='<span class="mf"><span class="n">'+paren(A,p)+'</span><span class="d">'+show(den)+'</span></span>';}
 else if(t==='prod'){var p=rnd(2,5);A[x]=1;A[y]=rnd(1,4);B[x]=rnd(-4,-1);B[y]=rnd(1,4);num=addM(A,powM(B,p));den={};raw='('+show(A)+')('+show(B)+')'+sup(p);}
 else{var p=-rnd(2,5);A[x]=rnd(1,3);A[y]=rnd(2,6);num={};num[x]=rnd(-8,-2);num[y]=1;den=powM(A,p);raw='<span class="mf"><span class="n">'+show(num)+'</span><span class="d">'+paren(A,p)+'</span></span>';}
 var mv=moveLayer(num,den),sm=simp(mv[0],mv[1]);
 var steps=[{lab:'1 · 次方乘入',html:fracTok(num,den),kind:'in'}];
 if(hasNeg(num,den)) steps.push({lab:'2 · 負指數搬層',html:fracTok(num,den),after:fracTok(mv[0],mv[1]),kind:'move'});
 steps.push({lab:(hasNeg(num,den)?'3':'2')+' · 同層加 · 異層減',html:fracTok(mv[0],mv[1]),after:fracTok(sm[0],sm[1]),kind:'simp'});
 steps.push({lab:'答案',html:fracShow(sm[0],sm[1]),kind:'ans',ans:true});
 G={i:0,steps:steps,q:raw};
}
function paint(anim){
 document.getElementById('q').innerHTML=G.q;
 document.getElementById('cards').innerHTML=G.steps.map(function(s,i){return '<div class="sc'+(i<G.i?' on':'')+(s.ans?' ans':'')+'"><div class="lab">'+s.lab+'</div><div class="math" id="m'+i+'">'+s.html+'</div></div>';}).join('');
 if(anim&&G.i>0) play(G.i-1);
}
function play(i){
 var s=G.steps[i],box=document.getElementById('m'+i);if(!s||!box)return;
 if(s.kind==='move'){box.querySelectorAll('.tok.neg').forEach(function(el){el.classList.add(el.dataset.l==='n'?'fly-dn':'fly-up');});setTimeout(function(){box.innerHTML=s.after;},720);}
 else if(s.kind==='simp'&&s.after){setTimeout(function(){box.innerHTML=s.after;box.querySelectorAll('.tok').forEach(function(el){el.classList.add('merge');});},500);}
}
function boot(){gen();paint(false);}
document.getElementById('filt').onclick=function(e){var b=e.target.closest('button');if(!b)return;FILT=b.dataset.t;[].forEach.call(document.querySelectorAll('#filt button'),function(x){x.classList.toggle('active',x===b);});boot();};
document.getElementById('new').onclick=boot;
document.getElementById('next').onclick=function(){if(G.i<G.steps.length){G.i++;paint(true);}};
document.getElementById('all').onclick=function(){G.i=G.steps.length;paint(false);G.steps.forEach(function(s,i){var box=document.getElementById('m'+i);if(s.after)box.innerHTML=s.after;});};
boot();
</script>
</body>
</html>

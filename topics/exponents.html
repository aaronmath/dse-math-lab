<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>整數指數定律｜動數 Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<link rel="stylesheet" href="../css/style.css"/>
<style>
.hero{padding:28px 0 6px}.hero h1{font-size:30px;margin:8px 0}
.seg{display:flex;flex-wrap:wrap;background:#0a1220;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
.seg button{background:transparent;border:0;color:var(--muted);padding:8px 12px;font:600 12px/1 "Noto Sans TC";cursor:pointer}
.seg button.active{background:rgba(94,234,212,.12);color:var(--teal)}
.col{display:grid;gap:12px}
.eqbox{background:#0a1220;border:1px solid var(--line);border-radius:16px;padding:16px}
.eqbox .lab{font-size:12px;color:var(--muted);margin-bottom:8px}
.eq{min-height:76px;display:flex;align-items:center;justify-content:center}
.eq .katex{font-size:1.45em;color:var(--text)}
.eq .katex-display{margin:0}
.eqbox.ans{border-color:rgba(94,234,212,.45)}
.eqbox.ans .katex{color:var(--teal)}
.ghost{opacity:0;transform:translateY(12px);transition:.4s}.ghost.on{opacity:1;transform:none}
</style>
</head>
<body>
<div class="bg-grid"></div>
<nav class="top"><div class="nav-inner">
<a class="brand" href="../index.html"><span class="logo">動</span>動數 Lab</a>
<div class="nav-links">
<a href="factorization.html">因式分解</a>
<a class="active" href="exponents.html">指數定律</a>
<a href="triangles.html">相似／全等</a>
<a href="ratios.html">面積與體積比</a>
</div></div></nav>
<div class="wrap">
<header class="hero"><div class="kicker">Topic 02 · 整數指數定律</div><h1>化簡 · <span>正指數</span></h1></header>
<div class="seg" id="filt">
<button class="active" data-t="all">全部</button>
<button data-t="den">括號在分母</button>
<button data-t="num">括號在分子</button>
<button data-t="prod">兩組相乘</button>
<button data-t="negout">外層負指數</button>
</div>
<div class="controls">
<button class="btn btn-primary" id="new">出題</button>
<button class="btn btn-ghost" id="next">下一步</button>
<button class="btn btn-ghost" id="all">全部步驟</button>
</div>
<div class="col" id="col"></div>
<footer><a href="../index.html" style="color:var(--teal)">返主頁</a></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="../js/main.js"></script>
<script>
function eq(el,tex){if(el&&window.katex)katex.render(tex,el,{displayMode:true,throwOnError:false});}
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function nz(a,b){var n=rnd(a,b);return n===0?(a||b||1):n;}
function t(b,e){if(!b)return '1';if(!e)return '';if(e===1)return b;return b+'^{'+e+'}';}
function ly(list,L){return list.filter(function(x){return x.L===L&&x.e&&x.b;});}
function layerTex(list,L){var a=ly(list,L);return a.length?a.map(function(x){return t(x.b,x.e);}).join(''):'1';}
function fracTex(list){if(!ly(list,'d').length)return layerTex(list,'n');return '\\dfrac{'+layerTex(list,'n')+'}{'+layerTex(list,'d')+'}';}
function parenTex(parts,p){return '\\left('+parts.map(function(x){return t(x.b,x.e);}).join('')+'\\right)^{'+p+'}';}
function mulIn(parts,p,L){return parts.map(function(x){return {b:x.b,e:x.e*p,L:L};});}
function moveOnly(list){return list.map(function(x){return x.e>=0?{b:x.b,e:x.e,L:x.L}:{b:x.b,e:-x.e,L:x.L==='n'?'d':'n'};});}
function addSame(list){var bag={};list.forEach(function(x){var k=x.L+'|'+x.b;bag[k]=bag[k]||{b:x.b,L:x.L,e:0};bag[k].e+=x.e;});return Object.keys(bag).map(function(k){return bag[k];}).filter(function(x){return x.e!==0;});}
function cross(list){var bag={};list.forEach(function(x){if(!x.b)return;if(!bag[x.b])bag[x.b]={n:0,d:0};bag[x.b][x.L]+=x.e;});var out=[];Object.keys(bag).sort().forEach(function(b){var n=bag[b].n||0,d=bag[b].d||0;if(n&&d){if(n>d)out.push({b:b,e:n-d,L:'n'});else if(d>n)out.push({b:b,e:d-n,L:'d'});}else if(n)out.push({b:b,e:n,L:'n'});else if(d)out.push({b:b,e:d,L:'d'});});return out.length?out:[{b:'',e:1,L:'n'}];}
function hasNeg(list){return list.some(function(x){return x.e<0;});}
var FILT='all',G={i:0,steps:[]};
function gen(){
 var pair=pick([['x','y'],['m','n'],['a','b']]),x=pair[0],y=pair[1];
 var kind=FILT==='all'?pick(['den','num','prod','negout']):FILT;
 var raw,mul,steps;
 if(kind==='prod'){
  var p=rnd(2,5),A=[{b:x,e:1},{b:y,e:rnd(1,4)}],B=[{b:x,e:rnd(-4,-1)},{b:y,e:nz(-4,4)}];
  mul=mulIn(A,1,'n').concat(mulIn(B,p,'n'));
  raw='\\left('+t(A[0].b,A[0].e)+t(A[1].b,A[1].e)+'\\right)'+parenTex(B,p);
  var added=addSame(mul),moved=moveOnly(added);
  steps=[{lab:'題目',tex:raw},{lab:'1 · 次方乘入',tex:fracTex(mul)}];
  steps.push({lab:'2 · 同層相加',tex:fracTex(mul),after:fracTex(added.length?added:[{b:'',e:1,L:'n'}])});
  if(hasNeg(added)) steps.push({lab:'3 · 搬層',tex:fracTex(added),after:fracTex(moved),ans:true});
  else steps.push({lab:'3 · 答案',tex:fracTex(added),ans:true});
 }else{
  if(kind==='den'){var p=rnd(2,5),A=[{b:x,e:rnd(1,3)},{b:y,e:1}],N=[{b:x,e:rnd(4,12),L:'n'},{b:y,e:rnd(3,10),L:'n'}];mul=N.concat(mulIn(A,p,'d'));raw='\\dfrac{'+t(N[0].b,N[0].e)+t(N[1].b,N[1].e)+'}{'+parenTex(A,p)+'}';}
  else if(kind==='num'){var p=rnd(2,4),A=[{b:x,e:nz(-3,4)},{b:y,e:rnd(-4,-1)}];mul=mulIn(A,p,'n').concat([{b:y,e:rnd(2,5),L:'d'}]);raw='\\dfrac{'+parenTex(A,p)+'}{'+t(y,ly(mul,'d')[0].e)+'}';}
  else{var p=-rnd(2,5),A=[{b:x,e:rnd(1,3)},{b:y,e:rnd(2,6)}],N=[{b:x,e:rnd(-8,-2),L:'n'},{b:y,e:1,L:'n'}];mul=N.concat(mulIn(A,p,'d'));raw='\\dfrac{'+t(N[0].b,N[0].e)+t(N[1].b,N[1].e)+'}{'+parenTex(A,p)+'}';}
  var moved=moveOnly(mul),done=cross(moved);
  steps=[{lab:'題目',tex:raw},{lab:'1 · 次方乘入',tex:fracTex(mul)}];
  if(hasNeg(mul)){steps.push({lab:'2 · 搬層',tex:fracTex(mul),after:fracTex(moved)});steps.push({lab:'3 · 化簡',tex:fracTex(moved),after:fracTex(done),ans:true});}
  else{steps.push({lab:'2 · 化簡',tex:fracTex(mul),after:fracTex(done)});steps.push({lab:'3 · 答案',tex:fracTex(done),ans:true});}
 }
 G={i:0,steps:steps};
}
function addCard(s){var el=document.createElement('div');el.className='eqbox ghost'+(s.ans?' ans':'');el.innerHTML='<div class="lab">'+s.lab+'</div><div class="eq"></div>';document.getElementById('col').appendChild(el);eq(el.querySelector('.eq'),s.tex);requestAnimationFrame(function(){el.classList.add('on');});if(s.after)setTimeout(function(){eq(el.querySelector('.eq'),s.after);},1200);}
function boot(){gen();document.getElementById('col').innerHTML='';addCard(G.steps[0]);G.i=1;}
function next(){if(G.i<G.steps.length){addCard(G.steps[G.i]);G.i++;}}
document.getElementById('filt').onclick=function(e){var b=e.target.closest('button');if(!b)return;FILT=b.dataset.t;[].forEach.call(document.querySelectorAll('#filt button'),function(x){x.classList.toggle('active',x===b);});boot();};
document.getElementById('new').onclick=boot;
document.getElementById('next').onclick=next;
document.getElementById('all').onclick=function(){var col=document.getElementById('col');col.innerHTML='';G.steps.forEach(function(s){var el=document.createElement('div');el.className='eqbox on'+(s.ans?' ans':'');el.innerHTML='<div class="lab">'+s.lab+'</div><div class="eq"></div>';col.appendChild(el);eq(el.querySelector('.eq'),s.after||s.tex);});G.i=G.steps.length;};
boot();
</script>
</body>
</html>

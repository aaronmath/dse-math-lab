<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>全等及相似｜動數 Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<link rel="stylesheet" href="../css/style.css"/>
<style>
.hero{padding:28px 0 8px}.hero h1{font-size:28px;margin:8px 0}
.seg{display:flex;flex-wrap:wrap;background:#0a1220;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
.seg button{background:0;border:0;color:var(--muted);padding:8px 12px;font:600 12px/1 "Noto Sans TC";cursor:pointer}
.seg button.active{background:rgba(94,234,212,.12);color:var(--teal)}
.lab2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
@media(max-width:900px){.lab2{grid-template-columns:1fr}}
svg{width:100%;height:340px;background:#070d18;border-radius:16px;border:1px solid var(--line)}
.hit{cursor:pointer}
.chipm{display:inline-block;margin:4px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:13px}
.ok{color:var(--teal)}.bad{color:#fb7185}
</style>
</head>
<body>
<div class="bg-grid"></div>
<nav class="top"><div class="nav-inner">
<a class="brand" href="../index.html"><span class="logo">動</span>動數 Lab</a>
<div class="nav-links">
<a href="factorization.html">因式分解</a>
<a href="exponents.html">指數定律</a>
<a class="active" href="triangles.html">相似／全等</a>
<a href="ratios.html">面積與體積比</a>
</div></div></nav>
<div class="wrap">
<header class="hero"><div class="kicker">Topic 03 · 全等及相似</div><h1>撞三個標記 · <span>先出理由</span></h1></header>
<div class="seg" id="mode"><button class="active" data-m="cong">全等</button><button data-m="sim">相似 AA</button></div>
<div class="controls"><button class="btn btn-primary" id="new">出題</button><button class="btn btn-ghost" id="reset">清空標記</button></div>
<div class="lab2">
<div><svg id="svg" viewBox="0 0 640 340"></svg><p class="note" id="hint">嗶圖上擁三個標記（邊或角）。</p></div>
<div class="panel">
<div style="color:var(--muted);font-size:12px">已選</div>
<div id="picked"></div>
<div id="verdict" style="margin-top:14px;font-weight:800;min-height:32px"></div>
<div id="line" style="min-height:48px"></div>
<p class="note" id="why"></p>
</div></div>
<footer><a href="../index.html" style="color:var(--teal)">返主頁</a></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="../js/main.js"></script>
<script>
function eq(id,tex){var el=document.getElementById(id);if(el&&window.katex)katex.render(tex||'',el,{displayMode:true,throwOnError:false});}
const TESTS=[{name:'SAS',marks:['sAB','aB','sBC'],why:'兩邊夾一角（SAS）'},{name:'ASA',marks:['aA','sAB','aB'],why:'兩角夾一邊（ASA）'},{name:'AAS',marks:['aA','aC','sBC'],why:'兩角及其中一組對應邊（AAS）'},{name:'SSS',marks:['sAB','sBC','sCA'],why:'三邊對應相等（SSS）'},{name:'RHS',marks:['aC','sAB','sBC'],why:'直角、斜邊、另一邊（RHS）'}];
var MODE='cong',sel=[];
function tri(svg,x,flip,tag){var pts=flip?[[x,220],[x+180,220],[x+70,70]]:[[x,220],[x+180,220],[x+110,70]];var A=pts[2],B=pts[0],C=pts[1];var g=document.createElementNS('http://www.w3.org/2000/svg','g');var p=document.createElementNS('http://www.w3.org/2000/svg','polygon');p.setAttribute('points',[B,C,A].map(function(q){return q.join(',');}).join(' '));p.setAttribute('fill','rgba(94,234,212,.08)');p.setAttribute('stroke','#9fb0c8');p.setAttribute('stroke-width','2');g.appendChild(p);function lab(pt,t,dx,dy){var te=document.createElementNS('http://www.w3.org/2000/svg','text');te.setAttribute('x',pt[0]+(dx||0));te.setAttribute('y',pt[1]+(dy||-10));te.setAttribute('fill','#e8eefc');te.setAttribute('font-size','16');te.setAttribute('font-weight','700');te.textContent=t;g.appendChild(te);}lab(A,tag[0],-4,-12);lab(B,tag[1],-14,18);lab(C,tag[2],8,18);function mid(P,Q){return [(P[0]+Q[0])/2,(P[1]+Q[1])/2];}[['sAB',mid(A,B),'S'],['sBC',mid(B,C),'S'],['sCA',mid(C,A),'S'],['aA',A,'A'],['aB',B,'A'],['aC',C,'A']].forEach(function(t){var c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',t[1][0]);c.setAttribute('cy',t[1][1]);c.setAttribute('r','13');c.setAttribute('fill','#122033');c.setAttribute('stroke','#5eead4');c.setAttribute('stroke-width','2');c.setAttribute('class','hit');c.dataset.mark=t[0];var tx=document.createElementNS('http://www.w3.org/2000/svg','text');tx.setAttribute('x',t[1][0]);tx.setAttribute('y',t[1][1]+4);tx.setAttribute('text-anchor','middle');tx.setAttribute('fill','#5eead4');tx.setAttribute('font-size','11');tx.setAttribute('font-weight','800');tx.textContent=t[2];tx.setAttribute('class','hit');tx.dataset.mark=t[0];g.appendChild(c);g.appendChild(tx);});svg.appendChild(g);}
function draw(){var svg=document.getElementById('svg');svg.innerHTML='';tri(svg,50,false,['A','B','C']);tri(svg,390,true,['D','E','F']);svg.querySelectorAll('.hit').forEach(function(el){el.onclick=function(){toggle(el.dataset.mark);};});}
function toggle(m){var i=sel.indexOf(m);if(i>=0)sel.splice(i,1);else if(sel.length<(MODE==='sim'?2:3))sel.push(m);paint();judge();document.querySelectorAll('#svg circle').forEach(function(c){c.setAttribute('fill',sel.indexOf(c.dataset.mark)>=0?'#134e4a':'#122033');});}
function paint(){document.getElementById('picked').innerHTML=sel.map(function(m){return '<span class="chipm">'+(m[0]==='s'?'邊 ':'角 ')+m.slice(1)+'</span>';}).join('')||'<span class="note">未擁</span>';}
function same(a,b){return a.slice().sort().join()===b.slice().sort().join();}
function judge(){var need=MODE==='sim'?2:3;document.getElementById('hint').textContent=MODE==='sim'?'擁兩隻角。':'擁三個標記（邊或角）。';if(sel.length<need){document.getElementById('verdict').textContent='';eq('line','');document.getElementById('why').textContent='';return;}var v=document.getElementById('verdict');if(MODE==='sim'){var ang=sel.filter(function(m){return m[0]==='a';});if(ang.length>=2){v.className='ok';v.textContent='理由：AA';eq('line','\\triangle ABC \\sim \\triangle DEF');document.getElementById('why').textContent='兩對應角相等（AA）。';}else{v.className='bad';v.textContent='未得';eq('line','');document.getElementById('why').textContent='相似先要兩對等角。';}return;}for(var i=0;i<TESTS.length;i++){if(same(sel,TESTS[i].marks)){v.className='ok';v.textContent='理由：'+TESTS[i].name;eq('line','\\triangle ABC \\cong \\triangle DEF');document.getElementById('why').textContent=TESTS[i].why;return;}}var ns=sel.filter(function(m){return m[0]==='s';}).length,na=sel.filter(function(m){return m[0]==='a';}).length;v.className='bad';if(na===3){v.textContent='AAA → 只得相似';eq('line','');document.getElementById('why').textContent='三隻角唔能證全等。';}else if(ns===2&&na===1){v.textContent='SSA？唔成立';eq('line','');document.getElementById('why').textContent='如果角唔係夾角，SSA 唔係全等理由。';}else{v.textContent='未組成合法理由';eq('line','');document.getElementById('why').textContent='要 SAS／ASA／AAS／SSS／RHS。';}}
function boot(){sel=[];draw();paint();judge();}
document.getElementById('mode').onclick=function(e){var b=e.target.closest('button');if(!b)return;MODE=b.dataset.m;[].forEach.call(document.querySelectorAll('#mode button'),function(x){x.classList.toggle('active',x===b);});boot();};
document.getElementById('new').onclick=boot;
document.getElementById('reset').onclick=boot;
boot();
</script>
</body>
</html>

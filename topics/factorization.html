<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>因式分解｜動數 Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<link rel="stylesheet" href="../css/style.css"/>
<style>
.hero{padding:28px 0 8px}.hero h1{font-size:28px;margin:8px 0}
.seg{display:flex;flex-wrap:wrap;background:#0a1220;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
.seg button{background:0;border:0;color:var(--muted);padding:8px 12px;font:600 12px/1 "Noto Sans TC";cursor:pointer}
.seg button.active{background:rgba(94,234,212,.12);color:var(--teal)}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.eq{min-height:70px;display:flex;align-items:center;justify-content:center}
.eq .katex{font-size:1.35em}.eq .katex-display{margin:0}
.brick{min-height:48px;background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.4);border-radius:12px;padding:8px}
.qbox{background:#0a1220;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.qbox .lab{font-size:12px;color:var(--muted);margin-bottom:6px}
.lights{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.light{border:1px solid var(--line);background:#0a1220;border-radius:12px;padding:10px 8px;text-align:center;cursor:pointer;color:var(--muted);font-size:13px;font-weight:700}
.light.on{border-color:var(--teal);color:var(--teal)}.light.bad{border-color:#fb7185;color:#fb7185}
.stepc{background:#0a1220;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}
.stepc .lab{font-size:12px;color:var(--muted)}
.log{color:var(--muted);font-size:14px;line-height:1.6;min-height:42px}
</style>
</head>
<body>
<div class="bg-grid"></div>
<nav class="top"><div class="nav-inner">
<a class="brand" href="../index.html"><span class="logo">動</span>動數 Lab</a>
<div class="nav-links">
<a class="active" href="factorization.html">因式分解</a>
<a href="exponents.html">指數定律</a>
<a href="triangles.html">相似／全等</a>
<a href="ratios.html">面積與體積比</a>
</div></div></nav>
<div class="wrap">
<header class="hero"><div class="kicker">Topic 01 · 因式分解</div><h1>(a) 三式 · <span>(b) 三問法</span></h1></header>
<div class="seg" id="mode"><button class="active" data-m="a">只做 (a)</button><button data-m="ab">(a) + (b)</button></div>
<div class="controls"><button class="btn btn-primary" id="new">出題</button><button class="btn btn-ghost" id="next">下一步</button></div>
<div class="grid"><div>
<div class="qbox"><div class="lab">(a)</div><div class="eq" id="qa"></div></div>
<div class="qbox" id="boxb" style="display:none"><div class="lab">(b)</div><div class="eq" id="qb"></div></div>
<div class="lights" id="lights"></div>
<p class="log" id="log"></p>
<div id="steps"></div>
</div>
<div class="panel">
<div class="lab" style="color:var(--muted);font-size:12px;margin-bottom:8px">鎖住嘅 (a) 因式</div>
<div class="brick eq" id="brick"></div>
<p class="note" style="margin-top:14px">(a) 抽公因／FMLA 01／(前+後)(前−後)。完全平方當 01 特例。<br/>(b) ① (a)+□　② □−(a)　③ □²−□²。</p>
</div></div>
<footer><a href="../index.html" style="color:var(--teal)">返主頁</a></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="../js/main.js"></script>
<script>
function eq(id,tex){var el=typeof id==='string'?document.getElementById(id):id;if(el&&window.katex)katex.render(tex||'',el,{displayMode:true,throwOnError:false});}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
const A=[
 {tex:'6x+9',pick:'cf',steps:['公因式 3 連符號抄出外面','3(2x+3)'],ans:'3(2x+3)'},
 {tex:'-2a^2+6a',pick:'cf',steps:['負號連公因一齊出去','-2a(a-3)'],ans:'-2a(a-3)'},
 {tex:'(5x+3y)^2-2(5x+3y)',pick:'cf',steps:['成括號 (5x+3y) 當公因','(5x+3y)[(5x+3y)-2]'],ans:'(5x+3y)(5x+3y-2)'},
 {tex:'9a^2-b^2',pick:'dos',steps:['前=3a，後=b','(3a+b)(3a-b)'],ans:'(3a+b)(3a-b)'},
 {tex:'(a+3)^2-b^2',pick:'dos',steps:['前=(a+3)，後=b','(a+3+b)(a+3-b)'],ans:'(a+3+b)(a+3-b)'},
 {tex:'m^2-(2n-3)^2',pick:'dos',steps:['後=(2n-3) 用括號鎖住','[m+(2n-3)][m-(2n-3)]=(m+2n-3)(m-2n+3)'],ans:'(m+2n-3)(m-2n+3)'},
 {tex:'x^2+5x+6',pick:'fmla',steps:['FMLA 01：a=1,b=5,c=6','根 x=-2,x=-3','正負相反：(x+2)(x+3)'],ans:'(x+2)(x+3)'},
 {tex:'x^2-x-6',pick:'fmla',steps:['FMLA 01：根 x=3,x=-2','(x-3)(x+2)'],ans:'(x-3)(x+2)'},
 {tex:'x^2-6x+9',pick:'fmla',steps:['FMLA 01：兩根都係 3（完全平方）','(x-3)^2'],ans:'(x-3)^2'},
 {tex:'a^2+4a+4',pick:'fmla',steps:['FMLA 01：兩根 a=-2','(a+2)^2'],ans:'(a+2)^2'}
];
const AB=[
 {a:{tex:'xy+y',pick:'cf',steps:['公因 y','y(x+1)'],ans:'y(x+1)'}, btex:'xy+y+5x+5',bpick:'1',bsteps:['問法①：(5x+5)+y(x+1)','5(x+1)+y(x+1)','(x+1)(y+5)'],bans:'(x+1)(y+5)'},
 {a:{tex:'a^2-4ab+4b^2',pick:'fmla',steps:['FMLA 01 兩根相同','(a-2b)^2'],ans:'(a-2b)^2'}, btex:'3a-6b+a^2-4ab+4b^2',bpick:'1',bsteps:['問法①：(a-2b)^2+3(a-2b)','(a-2b)[(a-2b)+3]'],bans:'(a-2b)(a-2b+3)'},
 {a:{tex:'a^2-4',pick:'dos',steps:['前=a，後=2','(a+2)(a-2)'],ans:'(a+2)(a-2)'}, btex:'ab+2b-a^2+4',bpick:'2',bsteps:['問法②：b(a+2)-(a+2)(a-2)','(a+2)[b-(a-2)]'],bans:'(a+2)(b-a+2)'},
 {a:{tex:'x^2-x-12',pick:'fmla',steps:['根 x=4,x=-3','(x-4)(x+3)'],ans:'(x-4)(x+3)'}, btex:'xy-4y-x^2+x+12',bpick:'2',bsteps:['問法②：y(x-4)-(x-4)(x+3)','(x-4)[y-(x+3)]'],bans:'(x-4)(y-x-3)'},
 {a:{tex:'x^2-10x+25',pick:'fmla',steps:['兩根 x=5','(x-5)^2'],ans:'(x-5)^2'}, btex:'x^2-10x+25-9y^2',bpick:'3',bsteps:['問法③：(x-5)^2-(3y)^2','(x-5+3y)(x-5-3y)'],bans:'(x-5+3y)(x-5-3y)'},
 {a:{tex:'4rs^2-s^2',pick:'cf',steps:['先抽 s^2','s^2(4r-1)'],ans:'s^2(4r-1)'}, btex:'16r-4-4rs^2+s^2',bpick:'2',bsteps:['問法②：4(4r-1)-s^2(4r-1)','(4r-1)(4-s^2)=(4r-1)(2+s)(2-s)'],bans:'(4r-1)(2+s)(2-s)'}
];
var MODE='a',Q=null,phase='pickA',si=0;
function lights(which){var box=document.getElementById('lights');box.innerHTML=which==='a'?'<button class="light" data-p="cf">抽公因</button><button class="light" data-p="fmla">FMLA 01</button><button class="light" data-p="dos">(前+後)(前−後)</button>':'<button class="light" data-p="1">① (a)+□</button><button class="light" data-p="2">② □−(a)</button><button class="light" data-p="3">③ □²−□²</button>';box.querySelectorAll('.light').forEach(function(b){b.onclick=function(){if(phase!=='pickA'&&phase!=='pickB')return;var want=phase==='pickA'?Q.a.pick:Q.b.bpick;box.querySelectorAll('.light').forEach(function(x){x.classList.remove('on','bad');});if(b.dataset.p===want){b.classList.add('on');phase=phase==='pickA'?'playA':'playB';si=0;document.getElementById('log').textContent='啲。撞下一步。';}else{b.classList.add('bad');document.getElementById('log').textContent='呢招唔啲，再擁。';}};});}
function addStep(tex){var d=document.createElement('div');d.className='stepc';d.innerHTML='<div class="lab">步驟</div><div class="eq"></div>';document.getElementById('steps').appendChild(d);eq(d.querySelector('.eq'),tex);}
function boot(){if(MODE==='a') Q={a:pick(A),b:null}; else {Q={b:pick(AB)};Q.a=Q.b.a;}phase='pickA';si=0;document.getElementById('steps').innerHTML='';document.getElementById('boxb').style.display=MODE==='ab'?'block':'none';eq('qa',Q.a.tex);if(MODE==='ab')eq('qb',Q.b.btex);eq('brick','');document.getElementById('log').textContent='先擁 (a) 用邊招。';lights('a');}
document.getElementById('mode').onclick=function(e){var b=e.target.closest('button');if(!b)return;MODE=b.dataset.m;[].forEach.call(document.querySelectorAll('#mode button'),function(x){x.classList.toggle('active',x===b);});boot();};
document.getElementById('new').onclick=boot;
document.getElementById('next').onclick=function(){if(phase==='pickA'||phase==='pickB'){document.getElementById('log').textContent='要先擁啲招。';return;}if(phase==='playA'){var st=Q.a.steps;if(si<st.length){addStep(st[si]);si++;}if(si>=st.length){eq('brick',Q.a.ans);if(MODE==='ab'){phase='pickB';si=0;lights('b');document.getElementById('log').textContent='(a) 鎖住。擁 (b) 問法。';}else{phase='done';document.getElementById('log').textContent='完成。';}}}else if(phase==='playB'){var st=Q.b.bsteps;if(si<st.length){addStep(st[si]);si++;}if(si>=st.length){phase='done';addStep(Q.b.bans);document.getElementById('log').textContent='(b) 完成。';}}};
boot();
</script>
</body>
</html>

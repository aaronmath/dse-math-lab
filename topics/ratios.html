<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>求積法比例｜動數 Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/>
<style>
.hero{padding:28px 0 8px}.hero h1{font-size:28px;margin:6px 0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.seg{display:flex;background:#0a1220;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--muted);padding:8px 12px;font:600 12px/1 "Noto Sans TC";cursor:pointer}
.seg button.active{background:rgba(94,234,212,.12);color:var(--teal)}
.lab{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:18px;align-items:start}
@media(max-width:920px){.lab{grid-template-columns:1fr}}
.stage-3d{border-radius:20px;background:#070d18;border:1px solid var(--line);overflow:hidden}
.stage-3d canvas{display:block;width:100%;height:460px}
.slats{margin-top:12px;display:grid;gap:10px}
.slat{background:#0a1220;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.slat label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.slat b{font-size:18px}
.cards{display:grid;gap:12px}
.lcard{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#0a1220;transition:opacity .25s}
.lcard.dim{opacity:.38}
.lcard .hd{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%}
.trio{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--line)}
.cell{padding:10px 6px;text-align:center}
.cell + .cell{border-left:1px solid var(--line)}
.cell>span{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}
.cell .tex{min-height:54px;display:flex;align-items:center;justify-content:center}
.mf{display:inline-block;text-align:center;line-height:1.2;color:var(--text);font-weight:700;font-size:18px}
.mf .n{display:block;border-bottom:1.5px solid currentColor;padding:0 6px 3px;white-space:nowrap}
.mf .d{display:block;padding:3px 6px 0;white-space:nowrap}
.mf sup{font-size:.65em}
.why{margin-top:28px;padding:16px 18px}.why h2{font-size:16px;margin:0 0 8px}
.why-board{display:flex;align-items:end;justify-content:center;gap:24px;min-height:140px;padding:8px}
#eq{min-height:56px;text-align:center;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="bg-grid"></div>
<nav class="top"><div class="nav-inner">
<a class="brand" href="../index.html"><span class="logo">動</span>動數 Lab</a>
<div class="nav-links">
<a href="factorization.html">因式分解</a>

<div class="wrap">
<header class="hero"><div class="kicker">Topic 04 · 求積法比例</div><h1>邊長比 · 面積比 · <span>體積比</span></h1></header>
<div class="toolbar">
<div class="seg" data-k="shape"><button class="active" data-v="cone">圓錐</button><button data-v="pyr">方錐</button></div>
<div class="seg" data-k="apex"><button class="active" data-v="up">尖向上</button><button data-v="down">尖向下</button></div>
<div class="seg" data-k="layers"><button data-v="1">1 層</button><button data-v="2">2 層</button><button class="active" data-v="3">3 層</button></div>
<div class="seg" data-k="cmp"><button class="active" data-v="small">細錐</button><button data-v="frustum">平截頭</button></div>
<div class="seg" data-k="mode"><button class="active" data-v="form">未約簡</button><button data-v="simp">已約簡</button></div>
</div>
<div class="lab">
<div>
<div class="stage-3d"><canvas id="cv" width="720" height="460"></canvas></div>
<div class="controls" style="margin-top:10px">
<button class="btn btn-ghost" id="spin-l">左轉</button>
<button class="btn btn-ghost" id="spin-r">右轉</button>
<button class="btn btn-ghost" id="auto">自動轉</button>
<button class="btn btn-ghost" id="reset">等分邊長</button>
</div>
<div class="slats" id="slats"></div>
</div>
<div class="cards" id="cards"></div>
</div>
<section class="panel why">
<h2>點解係平方同立方？</h2>
<label class="note" style="display:flex;justify-content:space-between">邊長 1 : <b id="kLab">2</b></label>
<input type="range" id="kRange" min="1" max="4" step="1" value="2"/>
<div class="why-board">
<div><div id="sq1" class="box" style="width:36px;height:36px;background:linear-gradient(135deg,#5eead4,#67e8f9)">1</div></div>
<div><div id="sq2" class="box" style="width:72px;height:72px;background:linear-gradient(135deg,#fbbf24,#f59e0b)">4</div></div>
<div class="cube-wrap"><div class="cube" id="cube">
<div class="face" style="background:#a78bfa;transform:translateZ(28px)"></div>
<div class="face" style="background:#7c3aed;transform:rotateY(180deg) translateZ(28px)"></div>
<div class="face" style="background:#8b5cf6;transform:rotateY(90deg) translateZ(28px)"></div>
<div class="face" style="background:#6d28d9;transform:rotateY(-90deg) translateZ(28px)"></div>
<div class="face" style="background:#c4b5fd;transform:rotateX(90deg) translateZ(28px)"></div>
<div class="face" style="background:#5b21b6;transform:rotateX(-90deg) translateZ(28px)"></div>
</div></div></div>
<div class="formula" id="eq"></div>
</section>
<footer><a href="../index.html" style="color:var(--teal)">返主頁</a></footer>
</div>
<script src="../js/main.js"></script>
<script>
const S={shape:"cone",apex:"up",layers:3,mode:"form",cmp:"small",H:8,cuts:[3,5],rot:.5,auto:true,k:2};
const COL=[["#2dd4bf","#0f766e"],["#fbbf24","#b45309"],["#a78bfa","#6d28d9"]];
function gcd(a,b){a=Math.abs(a|0);b=Math.abs(b|0);while(b){const t=a%b;a=b;b=t;}return a||1;}
function mf(n,d){return '<span class="mf"><span class="n">'+n+'</span><span class="d">'+d+'</span></span>';}
function pw(n,p){return p===1?String(n):n+'<sup>'+p+'</sup>';}
function simpF(n,d){const g=gcd(n,d);return mf(n/g,d/g);}
function powF(a,b,p){return S.mode==="simp"?simpF(Math.pow(a,p),Math.pow(b,p)):mf(pw(a,p),pw(b,p));}
function diffF(hi,lo,H,p){return S.mode==="simp"?simpF(Math.pow(hi,p)-Math.pow(lo,p),Math.pow(H,p)):mf(pw(hi,p)+' \u2212 '+pw(lo,p),pw(H,p));}
function linF(a,b){return S.mode==="simp"?simpF(a,b):mf(a,b);}
function put(id,html){const el=document.getElementById(id);if(el)el.innerHTML=html;}
function bounds(){const p=[0].concat(S.cuts.slice().sort(function(a,b){return a-b})).concat([S.H]);const o=[];for(let i=0;i<p.length-1;i++)o.push({lo:p[i],hi:p[i+1]});return o;}
function equalCuts(){if(S.layers===1)S.cuts=[];else if(S.layers===2)S.cuts=[Math.max(1,Math.round(S.H/2))];else{let a=Math.max(1,Math.round(S.H/3)),b=Math.max(a+1,Math.round(2*S.H/3));if(b>=S.H)b=S.H-1;if(a>=b)a=Math.max(1,b-1);S.cuts=[a,b];}}
function clampCuts(){S.cuts=S.cuts.map(function(c){return Math.min(S.H-1,Math.max(1,c|0));});S.cuts=Array.from(new Set(S.cuts)).sort(function(a,b){return a-b;}).slice(0,Math.max(0,S.layers-1));while(S.cuts.length<S.layers-1){let x=Math.round(S.H/2);while(S.cuts.indexOf(x)>=0&&x<S.H-1)x++;if(S.cuts.indexOf(x)<0)S.cuts.push(x);S.cuts.sort(function(a,b){return a-b;});}}
function lit(idx){if(S.layers===1)return true;if(S.cmp==="small")return idx===0;return idx>0;}
function renderSlats(){
 const box=document.getElementById("slats");
 let html='<div class="slat"><label>原錐邊長 <b style="color:#e8eefc">'+S.H+'</b></label><input type="range" id="hRange" min="3" max="24" value="'+S.H+'"></div>';
 S.cuts.forEach(function(c,i){html+='<div class="slat"><label>切面邊長 <b style="color:'+COL[i][0]+'">'+c+'</b></label><input type="range" min="1" max="'+(S.H-1)+'" value="'+c+'" data-i="'+i+'"></div>';});
 box.innerHTML=html;
 document.getElementById("hRange").oninput=function(e){setH(+e.target.value);};
 box.querySelectorAll("input[data-i]").forEach(function(inp){inp.oninput=function(){let v=+inp.value,i=+inp.dataset.i;const oth=S.cuts.filter(function(_,j){return j!==i;});if(oth.indexOf(v)>=0)v=v<S.H-1?v+1:v-1;S.cuts[i]=v;clampCuts();renderSlats();renderCards();};});
}
function renderCards(){
 const wrap=document.getElementById("cards"),H=S.H;
 wrap.innerHTML=bounds().map(function(L,idx){const col=COL[idx%3][0];const name=L.lo===0?"細錐 : 原錐":"平截頭 : 原錐";const dim=lit(idx)?"":" dim";return '<div class="lcard'+dim+'"><div class="hd" style="background:'+col+'22;color:'+col+'"><i class="dot" style="background:'+col+'"></i>'+name+' · '+L.lo+'→'+L.hi+'</div><div class="trio"><div class="cell"><span>邊長比</span><div class="tex" id="c'+idx+'a"></div></div><div class="cell"><span>面積比</span><div class="tex" id="c'+idx+'b"></div></div><div class="cell"><span>體積比</span><div class="tex" id="c'+idx+'c"></div></div></div></div>';}).join("");
 bounds().forEach(function(L,idx){if(L.lo===0){put("c"+idx+"a",linF(L.hi,H));put("c"+idx+"b",powF(L.hi,H,2));put("c"+idx+"c",powF(L.hi,H,3));}else{put("c"+idx+"a",linF(L.hi,H));put("c"+idx+"b",diffF(L.hi,L.lo,H,2));put("c"+idx+"c",diffF(L.hi,L.lo,H,3));}});
}
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
function resize(){const r=cv.getBoundingClientRect();const d=Math.min(2,devicePixelRatio||1);cv.width=r.width*d;cv.height=460*d;ctx.setTransform(d,0,0,d,0,0);}
addEventListener("resize",resize);
function project(x,y,z){const c=Math.cos(S.rot),s=Math.sin(S.rot);const xr=x*c-z*s,zr=x*s+z*c;const W=cv.getBoundingClientRect().width,sc=Math.min(W,460)*0.42;return [W/2+xr*sc,240-y*sc+zr*0.2*sc,zr];}
function yA(t){return S.apex==="up"?0.92-1.84*t:-0.92+1.84*t;}
function rad(t){return 0.62*t;}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";}
function cap(t,ex,color,far,sq,al){const y=yA(t)+ex,r=rad(t);ctx.beginPath();if(sq){[[-r,-r],[r,-r],[r,r],[-r,r]].map(function(p){return project(p[0],y,p[1]);}).forEach(function(p,i){i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);});}else{for(let i=0;i<=48;i++){const a=i/48*Math.PI*2;const p=project(Math.cos(a)*r,y,Math.sin(a)*r);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}}ctx.closePath();ctx.fillStyle=rgba(color,(far?0.14:0.32)*al);ctx.fill();ctx.strokeStyle=rgba("#e8eefc",0.5*al);ctx.stroke();}
function slice(t0,t1,ex,col,pyr,al){const y0=yA(t0)+ex,y1=yA(t1)+ex,r0=rad(t0),r1=rad(t1);if(!pyr){for(let i=0;i<36;i++){const a0=i/36*Math.PI*2,a1=(i+1)/36*Math.PI*2;const A=project(Math.cos(a0)*r0,y0,Math.sin(a0)*r0),B=project(Math.cos(a1)*r0,y0,Math.sin(a1)*r0);const C=project(Math.cos(a1)*r1,y1,Math.sin(a1)*r1),D=project(Math.cos(a0)*r1,y1,Math.sin(a0)*r1);const sh=0.45+0.55*(0.5+0.5*Math.cos(a0-S.rot));ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.lineTo(C[0],C[1]);ctx.lineTo(D[0],D[1]);ctx.closePath();ctx.fillStyle=rgba(col[0],(0.24+0.44*sh)*al);ctx.fill();ctx.strokeStyle=rgba(col[1],0.3*al);ctx.stroke();}cap(t1,ex,col[0],true,false,al);if(t0>0)cap(t0,ex,col[1],false,false,al);}else{const sq=[[-1,-1],[1,-1],[1,1],[-1,1]];for(let i=0;i<4;i++){const a=sq[i],b=sq[(i+1)%4];const A=project(a[0]*r0,y0,a[1]*r0),B=project(b[0]*r0,y0,b[1]*r0),C=project(b[0]*r1,y1,b[1]*r1),D=project(a[0]*r1,y1,a[1]*r1);const mid=Math.atan2(a[1]+b[1],a[0]+b[0]);const sh=0.4+0.6*(0.5+0.5*Math.cos(mid-S.rot));ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.lineTo(C[0],C[1]);ctx.lineTo(D[0],D[1]);ctx.closePath();ctx.fillStyle=rgba(col[0],(0.28+0.42*sh)*al);ctx.fill();ctx.strokeStyle=rgba("#e8eefc",0.35*al);ctx.stroke();}cap(t1,ex,col[0],true,true,al);if(t0>0)cap(t0,ex,col[1],false,true,al);}}
function head(x1,y1,x2,y2,col){const a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-10*Math.cos(a-0.4),y2-10*Math.sin(a-0.4));ctx.lineTo(x2-10*Math.cos(a+0.4),y2-10*Math.sin(a+0.4));ctx.closePath();ctx.fillStyle=col;ctx.fill();}
function arrows(){S.cuts.concat([S.H]).forEach(function(val,idx){const off=-0.68-idx*0.11;const pFar=project(off,yA(val/S.H),0),pApex=project(off,yA(0),0);const col=COL[idx%3][0];ctx.beginPath();ctx.moveTo(pFar[0],pFar[1]);ctx.lineTo(pApex[0],pApex[1]);ctx.strokeStyle=col;ctx.lineWidth=2.6;ctx.stroke();head(pFar[0],pFar[1],pApex[0],pApex[1],col);ctx.fillStyle=col;ctx.font="bold 18px Noto Sans TC";ctx.fillText(String(val),pFar[0]+8,pFar[1]+6);});}
function draw(){const W=cv.getBoundingClientRect().width;ctx.clearRect(0,0,W,460);ctx.fillStyle="#070d18";ctx.fillRect(0,0,W,460);const L=bounds(),gap=S.layers===1?0:0.018;L.map(function(ly,idx){return {ly:ly,idx:idx,z:project(0,yA((ly.lo+ly.hi)/2/S.H),0)[2]};}).sort(function(a,b){return a.z-b.z;}).forEach(function(item){slice(item.ly.lo/S.H,item.ly.hi/S.H,(S.apex==="up"?-1:1)*item.idx*gap*2,COL[item.idx%3],S.shape==="pyr",lit(item.idx)?1:0.26);});arrows();}
function setH(v){v=Math.max(3,Math.min(24,v|0));const old=S.H;S.H=v;S.cuts=S.cuts.map(function(c){return Math.round(c*S.H/old);});clampCuts();renderSlats();renderCards();}
function setK(k){S.k=k;document.getElementById("kLab").textContent=k;const s=36*k,sq2=document.getElementById("sq2");sq2.style.width=s+"px";sq2.style.height=s+"px";sq2.textContent=String(k*k);document.getElementById("cube").style.width=(28*k)+"px";document.getElementById("cube").style.height=(28*k)+"px";}
function bind(){document.querySelectorAll(".seg").forEach(function(seg){seg.querySelectorAll("button").forEach(function(b){b.onclick=function(){const k=seg.dataset.k,v=b.dataset.v;if(k==="layers"){S.layers=+v;equalCuts();if(S.layers===1)S.cmp="small";}else S[k]=v;seg.querySelectorAll("button").forEach(function(x){x.classList.toggle("active",x===b);});if(k==="layers"){document.querySelectorAll('[data-k="cmp"] button').forEach(function(x){x.classList.toggle("active",x.dataset.v===S.cmp);});}renderSlats();renderCards();};});});document.getElementById("spin-l").onclick=function(){S.rot-=0.25;};document.getElementById("spin-r").onclick=function(){S.rot+=0.25;};document.getElementById("auto").onclick=function(e){S.auto=!S.auto;e.target.classList.toggle("active",S.auto);};document.getElementById("reset").onclick=function(){equalCuts();renderSlats();renderCards();};document.getElementById("kRange").oninput=function(e){setK(+e.target.value);};}
function loop(){if(S.auto)S.rot+=0.005;draw();requestAnimationFrame(loop);}
function eq(){document.getElementById("eq").innerHTML='A<sub>1</sub>/A<sub>2</sub> = ('+mf('ℓ<sub>1</sub>','ℓ<sub>2</sub>')+')<sup>2</sup><span style="width:16px"></span>V<sub>1</sub>/V<sub>2</sub> = ('+mf('ℓ<sub>1</sub>','ℓ<sub>2</sub>')+')<sup>3</sup>';}
resize();renderSlats();renderCards();bind();setK(2);eq();loop();
</script>
</body>
</html>

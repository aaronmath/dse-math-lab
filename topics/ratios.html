<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>求積法比例｜動數 Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<link rel="stylesheet" href="../css/style.css"/>
<style>
.hero{padding:24px 0 6px}.hero h1{font-size:28px;margin:8px 0}
.seg{display:flex;flex-wrap:wrap;background:#0a1220;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 8px 10px 0}
.seg button{background:0;border:0;color:var(--muted);padding:8px 12px;font:600 12px/1 "Noto Sans TC";cursor:pointer}
.seg button.active{background:rgba(94,234,212,.12);color:var(--teal)}
.lab{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
@media(max-width:920px){.lab{grid-template-columns:1fr}}
canvas{display:block;width:100%;height:420px;background:#070d18;border-radius:18px;border:1px solid var(--line)}
.cards{display:grid;gap:10px}
.cardx{background:#0a1220;border:1px solid var(--line);border-radius:14px;padding:12px}
.cardx .hd{font-size:12px;color:var(--muted);margin-bottom:6px}
.eq{min-height:52px;display:flex;align-items:center;justify-content:center}
.eq .katex{font-size:1.25em}.eq .katex-display{margin:0}
.slat{background:#0a1220;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-top:8px}
.slat label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="bg-grid"></div>
<nav class="top"><div class="nav-inner">
<a class="brand" href="../index.html"><span class="logo">動</span>動數 Lab</a>
<div class="nav-links">
<a href="factorization.html">因式分解</a>
<a href="exponents.html">指數定律</a>
<a href="triangles.html">相似／全等</a>
<a class="active" href="ratios.html">面積與體積比</a>
</div></div></nav>
<div class="wrap">
<header class="hero"><div class="kicker">Topic 04 · 求積法比例</div><h1>邊長比 · <span>面積比 · 體積比</span></h1></header>
<div class="seg" id="shape">
<button class="active" data-s="circle">圓形</button>
<button data-s="sphere">球體</button>
<button data-s="cone">圓錐</button>
<button data-s="pyr">角錐</button>
</div>
<div class="lab"><div><canvas id="cv" width="720" height="420"></canvas><div id="slats"></div></div><div class="cards" id="cards"></div></div>
<footer><a href="../index.html" style="color:var(--teal)">返主頁</a></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="../js/main.js"></script>
<script>
function eq(el,tex){if(el&&window.katex)katex.render(tex,el,{displayMode:true,throwOnError:false});}
function gcd(a,b){a=Math.abs(a|0);b=Math.abs(b|0);while(b){var t=a%b;a=b;b=t;}return a||1;}
function frac(n,d){var g=gcd(n,d);return '\\dfrac{'+(n/g)+'}{'+(d/g)+'}';}
var S={shape:'circle',r1:3,r2:8};
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function resize(){var r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);cv.width=r.width*d;cv.height=420*d;ctx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',resize);
function slats(){var box=document.getElementById('slats');box.innerHTML='<div class="slat"><label>綠 邊長 <b style="color:#2dd4bf">'+S.r1+'</b></label><input id="a" type="range" min="1" max="12" value="'+S.r1+'"></div><div class="slat"><label>黃 邊長 <b style="color:#fbbf24">'+S.r2+'</b></label><input id="b" type="range" min="1" max="12" value="'+S.r2+'"></div>';document.getElementById('a').oninput=function(e){S.r1=+e.target.value;cards();};document.getElementById('b').oninput=function(e){S.r2=+e.target.value;cards();};}
function cards(){var a=S.r1,b=S.r2,wrap=document.getElementById('cards');var rows=[{t:'邊長比',x:'\\dfrac{'+a+'}{'+b+'}'}];rows.push({t:'面積比',x:'\\dfrac{'+a+'^{2}}{'+b+'^{2}}='+frac(a*a,b*b)});if(S.shape!=='circle') rows.push({t:'體積比',x:'\\dfrac{'+a+'^{3}}{'+b+'^{3}}='+frac(a*a*a,b*b*b)});wrap.innerHTML=rows.map(function(r,i){return '<div class="cardx"><div class="hd">'+r.t+'</div><div class="eq" id="e'+i+'"></div></div>';}).join('');rows.forEach(function(r,i){eq(document.getElementById('e'+i),r.x);});}
function circ(x,y,rad,col){ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();ctx.strokeStyle='rgba(232,238,252,.45)';ctx.stroke();}
function sphere(x,y,rad,c1,c2){var g=ctx.createRadialGradient(x-rad*0.3,y-rad*0.35,rad*0.1,x,y,rad);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='rgba(232,238,252,.35)';ctx.stroke();}
function cone(x,base,h,col){ctx.beginPath();ctx.moveTo(x,80);ctx.lineTo(x-base,80+h);ctx.lineTo(x+base,80+h);ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.strokeStyle='rgba(232,238,252,.4)';ctx.stroke();ctx.beginPath();ctx.ellipse(x,80+h,base,14,0,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.06)';ctx.fill();ctx.stroke();}
function pyr(x,base,h,col){ctx.beginPath();ctx.moveTo(x,70);ctx.lineTo(x-base,70+h);ctx.lineTo(x+base*0.2,70+h-18);ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(x,70);ctx.lineTo(x+base*0.2,70+h-18);ctx.lineTo(x+base,70+h);ctx.lineTo(x-base,70+h);ctx.closePath();ctx.fillStyle='rgba(0,0,0,.15)';ctx.fill();ctx.stroke();}
function draw(){var W=cv.getBoundingClientRect().width;ctx.clearRect(0,0,W,420);ctx.fillStyle='#070d18';ctx.fillRect(0,0,W,420);var m=Math.max(S.r1,S.r2)||1,u=Math.min(W*0.18,70);var ra=u*S.r1/m,rb=u*S.r2/m;if(S.shape==='circle'){circ(W*0.30,210,ra,'rgba(45,212,191,.45)');circ(W*0.70,210,rb,'rgba(251,191,36,.45)');}else if(S.shape==='sphere'){sphere(W*0.30,210,ra,'#99f6e4','#0f766e');sphere(W*0.70,210,rb,'#fde68a','#b45309');}else if(S.shape==='cone'){cone(W*0.30,ra,ra*2.2,'rgba(45,212,191,.4)');cone(W*0.70,rb,rb*2.2,'rgba(251,191,36,.4)');}else{pyr(W*0.30,ra,ra*2.2,'rgba(45,212,191,.4)');pyr(W*0.70,rb,rb*2.2,'rgba(251,191,36,.4)');}ctx.fillStyle='#2dd4bf';ctx.font='bold 16px Noto Sans TC';ctx.fillText(String(S.r1),W*0.30-6,40);ctx.fillStyle='#fbbf24';ctx.fillText(String(S.r2),W*0.70-6,40);}
function loop(){draw();requestAnimationFrame(loop);}
document.getElementById('shape').onclick=function(e){var b=e.target.closest('button');if(!b)return;S.shape=b.dataset.s;[].forEach.call(document.querySelectorAll('#shape button'),function(x){x.classList.toggle('active',x===b);});cards();};
resize();slats();cards();loop();
</script>
</body>
</html>
